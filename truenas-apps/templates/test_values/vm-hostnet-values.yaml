resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Europe/Berlin

bombvault:
  app_key: "3f9c1d47a8b20e65fd913c07ab4e28d5106f7be3c9a4520d8e17fb6390c2a4d1"
  http_only: true
  backup_max_hours: 12
  self_container_name: ix-bombvault-bombvault-1
  libvirt_uri: qemu+ssh://root@192.0.2.10/system?socket=/run/truenas_libvirt/libvirt-sock
  libvirt_host: 192.0.2.10
  libvirt_ssh_user: root
  libvirt_ssh_port: 22
  additional_envs:
    - name: BOMBVAULT_EXTRA
      value: "1"

network:
  host_network: true
  web_port:
    bind_mode: published
    port_number: 30443
    host_ips: []
  http_port:
    bind_mode: published
    port_number: 30300
    host_ips: []

ix_volumes:
  config: /opt/tests/mnt/bombvault/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  host_data:
    path: /opt/tests/mnt/bombvault/hostdata
    create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /extra
      host_path_config:
        path: /opt/tests/mnt/bombvault/extra
        create_host_path: true

labels: []
