name: Instant Repo-Watch Ping

# Tells junkerderprovinz/repo-watch about new issues, pull requests, comments
# and reviews from other people. repo-watch posts them to Matrix with its own
# credentials, so this workflow never sees a Matrix secret. The same file sits
# in every repo of this account; activity elsewhere is left to repo-watch's
# periodic poll.

on:
  issues:
    types: [opened]
  # pull_request_target, because a fork PR gets no secrets under pull_request
  # and the dispatch below would fail on every outside PR. It is safe here: the
  # job checks out no code, and event fields reach the script only through
  # environment variables.
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  dispatch:
    # Skip the owner's own activity and bots.
    if: github.event.sender.login != 'junkerderprovinz' && !endsWith(github.event.sender.login, '[bot]')
    runs-on: ubuntu-latest
    # The default limit is six hours, far too long for one hanging API call.
    timeout-minutes: 5
    steps:
      - name: Dispatch to repo-watch
        env:
          GH_TOKEN: ${{ secrets.REPOWATCH_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.event.sender.login }}
        # Titles are attacker-controlled, so event fields reach the script as
        # environment variables. Put into the script with ${{ }} they would be
        # a shell injection.
        run: |
          kind="issue"
          number="$ISSUE_NUMBER"
          title="$ISSUE_TITLE"
          url="$ISSUE_URL"
          case "$EVENT_NAME" in
            # The trigger above arrives as pull_request_target.
            pull_request|pull_request_target)
              kind="pr"; number="$PR_NUMBER"; title="$PR_TITLE"; url="$PR_URL" ;;
            issue_comment)
              kind="comment"; number="$ISSUE_NUMBER"; title="$ISSUE_TITLE"; url="$COMMENT_URL" ;;
            pull_request_review)
              kind="review"; number="$PR_NUMBER"; title="$PR_TITLE"; url="$REVIEW_URL" ;;
          esac
          gh api "repos/junkerderprovinz/repo-watch/dispatches" \
            -f event_type=repo-activity \
            -f "client_payload[repo]=$REPO_NAME" \
            -f "client_payload[kind]=$kind" \
            -f "client_payload[number]=$number" \
            -f "client_payload[title]=$title" \
            -f "client_payload[url]=$url" \
            -f "client_payload[actor]=$ACTOR"
